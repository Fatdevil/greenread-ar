<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GreenRead AR — Banguide</title>
  <script>window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.105.1/Build/Cesium/';</script>
  <script src="https://unpkg.com/cesium@1.105.1/Build/Cesium/Cesium.js"></script>
  <link href="https://unpkg.com/cesium@1.105.1/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Mobile-first enhancements for flyover */
    #cesiumContainer { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 0; }
    
    .course-hud {
      position: fixed;
      top: env(safe-area-inset-top, 40px);
      left: 20px;
      right: 20px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px 24px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
    }
    
    .course-hud-left h1 { font-size: 22px; font-weight: 800; margin: 0; color: var(--text-primary); letter-spacing: -0.5px;}
    .course-hud-left p { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 4px 0 0 0;}
    
    .course-hud-right { text-align: right; }
    .course-hud-right .par { font-size: 12px; font-weight: 700; color: var(--primary-light); background: rgba(26, 122, 74, 0.2); padding: 4px 10px; border-radius: 12px;}
    .course-hud-right .dist { font-size: 24px; font-weight: 800; color: white; display:block; margin-top: 8px; font-variant-numeric: tabular-nums;}

    /* Bottom Sheet */
    .flyover-bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, var(--bg-deep) 40%, transparent);
      padding: 80px 24px 50px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none; /* Let clicks pass through except on buttons */
    }

    #btn-fly {
      pointer-events: auto;
      width: 100%;
      max-width: 350px;
      padding: 18px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-xl);
      font-size: 17px;
      font-family: var(--font);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(26, 122, 74, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      position: relative;
    }

    #btn-fly::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }

    #btn-fly:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 40px rgba(26, 122, 74, 0.6);
    }
    
    .cesium-viewer-bottom, .cesium-viewer-toolbar, .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer, .cesium-viewer-fullscreenContainer { 
        visibility: hidden !important; pointer-events: none !important;
    }
    
    /* Config Panel hidden by default, accessible via a small settings text */
    .config-panel {
      position: fixed; top: 120px; left: 20px; right: 20px; background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    }
    .config-panel.show { opacity: 1; pointer-events: auto; }
    .config-panel label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; font-weight: 600;}
    .config-panel input { background: var(--bg-deep); border: 1px solid var(--border); color: white; padding: 12px; border-radius: var(--radius-md); margin-bottom: 16px; width: 100%; box-sizing: border-box; font-family: var(--font);}
    .config-panel button { width: 100%; background: var(--text-primary); border: none; color: var(--bg-deep); padding: 14px; border-radius: var(--radius-md); font-weight: bold; cursor: pointer; transition: 0.2s;}
    
    .dev-toggle {
       position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,0.5); border: none; color: var(--text-dim); font-size: 10px; cursor: pointer; padding: 4px 12px; border-radius: 10px;
    }
  </style>
</head>
<body>
  
  <button class="dev-toggle" onclick="document.getElementById('config').classList.toggle('show')">DEV: Karta</button>
  
  <div id="config" class="config-panel">
      <label>Tee Box GPS (Lat, Lon)</label>
      <input type="text" id="tee-input" value="30.2010, -81.3935" placeholder="Tee">
      <label>Green Center (Lat, Lon)</label>
      <input type="text" id="green-input" value="30.2005, -81.3920" placeholder="Green">
      <button id="btn-update-course">Uppdatera Data</button>
  </div>

  <div class="course-hud">
    <div class="course-hud-left">
      <h1>Hål 17 (Demo)</h1>
      <p>PGA TPC Sawgrass</p>
    </div>
    <div class="course-hud-right">
      <span class="par">PAR 3</span>
      <span class="dist">125m</span>
    </div>
  </div>
  
  <div class="flyover-bottom-sheet">
    <button id="btn-fly">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: -4px;">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>Starta Flyover</span>
    </button>
  </div>
  
  <div id="cesiumContainer"></div>
  
  <script src="flyover_app.js"></script>
</body>
</html>
