<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GreenRead AR — 2.5D Banguide</title>
  
  <!-- MapLibre istället för Google Maps (Kräver ingen API nyckel!) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    #mapContainer { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 0; }
    
    .course-hud {
      position: fixed;
      top: env(safe-area-inset-top, 40px);
      left: 20px;
      right: 20px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px 24px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
    }
    
    .course-hud-left h1 { font-size: 22px; font-weight: 800; margin: 0; color: var(--text-primary); letter-spacing: -0.5px;}
    .course-hud-left p { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 4px 0 0 0;}
    
    .course-hud-right { text-align: right; }
    .course-hud-right .par { font-size: 12px; font-weight: 700; color: var(--primary-light); background: rgba(26, 122, 74, 0.2); padding: 4px 10px; border-radius: 12px;}
    .course-hud-right .dist { font-size: 24px; font-weight: 800; color: white; display:block; margin-top: 8px; font-variant-numeric: tabular-nums;}

    .distance-badge {
      position: fixed;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 31, 20, 0.9);
      border: 2px solid var(--primary-light);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 18px;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .flyover-bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, var(--bg-deep) 40%, transparent);
      padding: 80px 24px 50px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    #btn-ar {
      pointer-events: auto;
      width: 100%;
      max-width: 350px;
      padding: 18px 24px;
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      color: white;
      border: none;
      border-radius: var(--radius-xl);
      font-size: 17px;
      font-family: var(--font);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    #btn-ar:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
    }
  </style>
</head>
<body>

  <!-- Karta via MapLibre -->
  <div id="mapContainer"></div>

  <div class="course-hud">
    <div class="course-hud-left">
      <h1>Hål 17 (Fairway)</h1>
      <p>PGA TPC Sawgrass</p>
    </div>
    <div class="course-hud-right">
      <span class="par">PAR 3</span>
      <span class="dist">Slår ut...</span>
    </div>
  </div>

  <div class="distance-badge" id="live-distance">
    125 m till Green
  </div>
  
  <div class="flyover-bottom-sheet">
    <button id="btn-ar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: -4px;">
        <path d="M4 4h4v4H4z"></path>
        <path d="M4 16h4v4H4z"></path>
        <path d="M16 4h4v4h-4z"></path>
        <path d="M16 16h4v4h-4z"></path>
        <path d="M12 8v8"></path>
        <path d="M8 12h8"></path>
      </svg>
      <span>Växla till Green (AR)</span>
    </button>
  </div>
  
  <script src="fairway.js"></script>
</body>
</html>
